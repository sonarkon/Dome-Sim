<html lang="en">
<head>
<meta charset="utf-8">
<meta name="author" content="Sonarkon">
<meta name="description" content="HOPE Dome Sim – browser-based dome projection simulator by Sonarkon">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- link preview (Open Graph / Twitter card) -->
<meta property="og:type" content="website">
<meta property="og:title" content="HOPE Dome Sim">
<meta property="og:description" content="Browser-based dome projection simulator – layers, warping, seat view, domemaster output. By Sonarkon.">

<title>HOPE Dome Sim</title>
<style>
:root{--bg:#0c0d10;--panel:#14161b;--card:#1a1d24;--line:#272b35;--fg:#e7e9ee;--dim:#8a91a0;--a:#ff9a3c;--b:#3cc8ff;--acc:#8aa4ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:12px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:auto minmax(0,1fr) auto;height:100%}
#app.noL #panelL,#app.noR #panelR{display:none}
#panelL{grid-column:1;grid-row:1}
#stage{grid-column:2;grid-row:1}
#panelR{grid-column:3;grid-row:1}
#stage{position:relative;min-width:0;overflow:hidden;background:#050608}
#gl,#ov{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#ov{touch-action:none;cursor:grab}
#ov.grabbing{cursor:grabbing}
#views{position:absolute;left:12px;top:12px;display:flex;gap:2px;background:rgba(20,22,27,.85);border:1px solid var(--line);border-radius:8px;padding:3px;backdrop-filter:blur(8px)}
#views button{background:none;border:0;color:var(--dim);padding:5px 10px;border-radius:6px;font:inherit;cursor:pointer}
#views button.on{background:var(--acc);color:#0b0d14;font-weight:600}
#views kbd{opacity:.55;font:inherit;margin-left:4px}
#views .sep{width:1px;background:var(--line);margin:3px 4px}
#views button#uiToggle,#views button#showToggle{display:grid;place-items:center;padding:5px 8px}
#views button#gridToggle{display:grid;place-items:center;padding:5px 8px;color:var(--dim)}
#views button#gridToggle.on{color:var(--fg)}
#views #gridAmt{width:64px;margin:0 6px 0 0;accent-color:var(--acc);align-self:center}
#views #gridAmt:disabled{opacity:.3}
#views button#showToggle{color:var(--dim)}
#views button#showToggle.on{background:var(--acc);color:#0b0d14}
#views button#uiToggle.on{background:none;color:var(--fg);font-weight:400}
#views button#uiToggle:not(.on){color:var(--dim)}
#uiToggle .slash{display:none}
#uiToggle:not(.on) .slash{display:block;stroke:var(--acc)}
#hint{position:absolute;left:12px;bottom:10px;color:var(--dim);font-size:11px;background:rgba(12,13,16,.7);padding:4px 8px;border-radius:6px;pointer-events:none;max-width:calc(100% - 190px)}
#fps{position:absolute;right:12px;bottom:10px;color:var(--dim);font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(12,13,16,.7);padding:4px 8px;border-radius:6px;pointer-events:none;text-align:right;font-variant-numeric:tabular-nums;white-space:pre}
#fps b{color:var(--fg);font-weight:600}
#fps .warn{color:#ffb454}
#fps .bad{color:#ff6b6b}
#nogl{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
#nogl[hidden]{display:none}
aside{overflow-y:auto;background:var(--panel);padding:10px 14px 40px}
#panelL{width:330px;border-right:1px solid var(--line)}
#panelR{width:340px;border-left:1px solid var(--line);display:flex;flex-direction:column}
#panelR>*{flex:none}
#panelR>.presetbar{padding:2px 0 8px;border-bottom:1px solid var(--line)}
#panelR>.presetbar .presetlabel,.seclabel{color:var(--dim);font:600 11px/1.4 inherit;letter-spacing:.08em;text-transform:uppercase;padding:8px 2px 4px}
.staticsec{border-top:1px solid var(--line);padding-bottom:6px}
.staticsec:first-of-type{border-top:0}
#panelR>.presetbar .btns{margin:4px 0 0}
#panelR>.credits{margin-top:auto;padding:14px 2px 0;border-top:1px solid var(--line);font-size:11px;line-height:1.65;color:var(--dim)}
#panelR>.credits a{color:inherit}
#panelR>.credits b{color:var(--fg);font-weight:600}
body.demo #fps{display:none}
body.demo-popup #views,body.demo-popup .edge,body.demo-popup #hint{display:none}
.edge{position:absolute;top:50%;transform:translateY(-50%);width:15px;height:54px;border:1px solid var(--line);background:rgba(20,22,27,.82);color:var(--dim);cursor:pointer;z-index:5;padding:0;font:inherit;font-size:14px;line-height:1}
.edge:hover{color:var(--fg)}
#toggleL{left:0;border-radius:0 8px 8px 0;border-left:0}
#toggleR{right:0;border-radius:8px 0 0 8px;border-right:0}
.sec{border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.sechead{display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;color:var(--dim);font:600 11px/1.4 inherit;letter-spacing:.08em;text-transform:uppercase;padding:11px 2px 9px;cursor:pointer;text-align:left}
.sechead:hover{color:var(--fg)}
.chev{flex:none;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin:-3px 3px 0 1px;transition:transform .12s}
.sec.closed>.sechead .chev{transform:rotate(-45deg);margin:0 3px 0 1px}
.sec.closed>.secbody{display:none}
.sec.sub{border-top:0}
.sec.sub>.sechead{font-size:11px;text-transform:none;letter-spacing:0;padding:8px 2px 5px}
.secbody{padding:0 0 8px}
.lrow .ib svg{display:block;width:15px;height:15px}
.lrow .grip{flex:none;display:grid;place-items:center;width:16px;height:20px;margin-left:-4px;color:var(--dim);cursor:grab;touch-action:none;border-radius:4px;opacity:.7}
.lrow .grip:hover{opacity:1;background:#ffffff14}
.lrow .grip svg{width:14px;height:14px}
.lrow.dragging{opacity:.3;border-color:var(--acc)}
.lrow.ghost{position:fixed;z-index:100000;margin:0;pointer-events:none;border:1px solid var(--acc);border-radius:8px;padding:6px 8px;background:var(--card);box-shadow:0 10px 28px rgba(0,0,0,.55);opacity:.97;font:inherit;color:var(--fg);cursor:grabbing}
.lrow.drop-above{box-shadow:0 -2px 0 0 var(--acc)}
.lrow.drop-below{box-shadow:0 2px 0 0 var(--acc)}
body.dnd,body.dnd *{cursor:grabbing!important}
.lrow .ib.on{color:var(--acc)}
aside .projname{width:100%;margin:2px 0 8px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font:inherit;font-size:13px;font-weight:600}
aside .projname::placeholder{color:var(--dim);font-weight:400}
aside .projname:focus{outline:none;border-color:var(--acc)}
aside .brand{font-size:15px;letter-spacing:.02em;margin:2px 0 4px;color:var(--fg)}
aside .brand b{letter-spacing:.14em;margin-right:4px}
h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px;font-weight:600}
h2:first-child{margin-top:2px}
h4{margin:12px 0 6px;font-size:11px;color:var(--dim);font-weight:600}
.row{display:grid;grid-template-columns:96px 1fr 46px;gap:8px;align-items:center;margin:4px 0}
.row.two{grid-template-columns:96px 1fr}
.row label{color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc);margin:0}
select,button.btn,input[type=file]{width:100%;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font:inherit}
button.btn{cursor:pointer}
button.btn:hover{border-color:var(--acc)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.btns button.btn{width:auto;flex:1 1 auto}
.notice{border-left:3px solid var(--acc);background:#8aa4ff14;padding:7px 10px;border-radius:0 6px 6px 0;color:var(--fg)}
.offline-only>*:not(.notice):not(details){opacity:.4;pointer-events:none}
.row2sel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.mini{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--dim)}
.chips{display:flex;gap:6px;margin:6px 0}
.chip{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--dim);cursor:pointer;font:inherit;font-size:12px}
.chip:hover{border-color:var(--acc)}
.chip.on{border-color:var(--acc);background:#8aa4ff22;color:var(--fg)}
.transport{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;margin:6px 0}
.transport .pp{width:30px;padding:5px 0;display:grid;place-items:center}
.transport .pp svg{width:14px;height:14px;display:block}
.transport .tt{color:var(--dim);font-variant-numeric:tabular-nums;font-size:11px;white-space:nowrap}
button.btn.primary{background:var(--acc);color:#0b0d14;border-color:var(--acc);font-weight:600}
.btns.icons button.btn{display:grid;place-items:center;padding:5px 0;flex:1 1 0}
.btns.icons button.btn svg{width:20px;height:18px;display:block}
.btns.icons button.btn.on{border-color:var(--acc);color:var(--acc)}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--dim);font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{color:#0b0d14}
.tabs button[data-i="0"].on{background:var(--a);border-color:var(--a)}
.tabs button[data-i="1"].on{background:var(--b);border-color:var(--b)}
.card{display:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px 12px}
.card.on{display:block}
.status{color:var(--dim);font-size:11px;margin:4px 0 2px;min-height:15px}
.chk{display:flex;gap:8px;align-items:center;margin:5px 0}
.chk input{accent-color:var(--acc)}
.llist .lrow{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:5px 0;background:var(--card);cursor:grab;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;touch-action:pan-y}
.llist .lrow button,.llist .lrow select,.llist .lrow input{cursor:pointer}
.llist .lrow.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.lrow .top{display:flex;gap:4px;align-items:center}
.lrow .dot{width:10px;height:10px;border-radius:50%;flex:none;margin-right:2px}
.lrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.lrow .ib{background:none;border:0;color:var(--fg);cursor:pointer;padding:2px 5px;border-radius:5px;font:inherit;line-height:1.2}
.lrow .ib:hover{background:#ffffff14}
.lrow .ib.off{opacity:.3}
.lrow .ib:disabled{opacity:.2;cursor:default}
.lrow .bot{display:grid;grid-template-columns:92px 1fr 38px;gap:8px;align-items:center;margin-top:5px}
.lrow .bot select{padding:2px 4px;font-size:11px}
.lrow .bot .v{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.lrow.locked .nm::after{content:var(--t-locked," · locked");color:var(--dim);font-weight:400}
aside .langsw{float:right;display:inline-flex;gap:2px;margin-top:1px}
aside .langsw button{background:none;border:1px solid var(--line);color:var(--dim);font:600 10px/1 inherit;letter-spacing:.06em;padding:4px 6px;border-radius:5px;cursor:pointer}
aside .langsw button.on{background:var(--acc);border-color:var(--acc);color:#0b0d14}
aside .credit{font-size:10.5px;color:var(--dim);margin:0 0 6px;letter-spacing:.02em}
aside .credit a{color:inherit}
.card.locked .lockable{opacity:.45;pointer-events:none}
details{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:10px;color:var(--dim)}
details summary{cursor:pointer;color:var(--fg)}
details p,details ol{margin:6px 0;padding-left:16px}
details p{padding:0}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
  <aside id="panelL"></aside>
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
    <div id="views">
      <button data-v="inside">Inside<kbd>1</kbd></button>
      <button data-v="outside">Outside<kbd>2</kbd></button>
      <button data-v="master">Domemaster<kbd>3</kbd></button>
      <span class="sep"></span>
      <button id="showToggle" title="Show mode: throttle the local preview so the Syphon output gets more GPU · S" aria-label="Show mode">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
          <path d="M2.2 11.5a5.8 5.8 0 1 1 11.6 0"/><path d="M8 11.5 L11 6.5"/><circle cx="8" cy="11.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button id="uiToggle" title="Show / hide controls (frames, corner handles, labels) · R" aria-label="Show / hide controls">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
          <rect x="3.5" y="3.5" width="9" height="9" rx="0.5"/>
          <g fill="currentColor" stroke="none"><rect x="1.6" y="1.6" width="3.6" height="3.6" rx="0.6"/><rect x="10.8" y="1.6" width="3.6" height="3.6" rx="0.6"/><rect x="1.6" y="10.8" width="3.6" height="3.6" rx="0.6"/><rect x="10.8" y="10.8" width="3.6" height="3.6" rx="0.6"/></g>
          <path class="slash" d="M1.5 14.5 L14.5 1.5" stroke-width="1.6"/>
        </svg>
      </button>
      <span class="sep"></span>
      <input id="gridAmt" type="range" min="0.05" max="1" step="0.01" title="Grid strength" aria-label="Grid strength">
      <button id="gridToggle" title="Show / hide grid · G" aria-label="Show / hide grid">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
          <circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2v12M3.6 4.6c2.8 1.2 6 1.2 8.8 0M3.6 11.4c2.8-1.2 6-1.2 8.8 0"/>
        </svg>
      </button>
    </div>
    <div id="hint"></div>
    <div id="fps"></div>
    <button id="toggleL" class="edge" title="Collapse / expand layers ([)" aria-label="Collapse / expand layers">‹</button>
    <button id="toggleR" class="edge" title="Collapse / expand output &amp; view (])" aria-label="Collapse / expand output">›</button>
    <div id="nogl" hidden>WebGL2 is not available in this browser.</div>
  </div>
  <aside id="panelR"></aside>
</div>

<script>
(() => {
'use strict';

/* ───────────── Helpers ───────────── */
const D2R = Math.PI / 180, R2D = 180 / Math.PI, TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const V = {
  add: (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]],
  sub: (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]],
  mul: (a, s) => [a[0]*s, a[1]*s, a[2]*s],
  dot: (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2],
  cross: (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; },
};
const wrapPi = a => a - TAU * Math.floor((a + Math.PI) / TAU);
/* ───────────── Sprache / Language (DE · EN) ───────────── */
const LANG_KEY = 'hopedomesim.lang';
const URLQ = new URLSearchParams(location.search);
const DEMO = URLQ.get('demo');   // 'inside' | 'popup' | 'syphon' – fixed scene, e.g. for README screenshots
const LANG = (() => {
  if (URLQ.get('lang') === 'de' || URLQ.get('lang') === 'en') return URLQ.get('lang');
  try { const v = localStorage.getItem(LANG_KEY); if (v === 'de' || v === 'en') return v; } catch (e) {}
  return 'en';
})();
document.documentElement.lang = LANG;
const IS_MAC = /Mac|iPhone|iPad/i.test(navigator.platform || navigator.userAgent || '');
// IS_LOCAL: running from localhost / a file – the only situation where the Syphon bridge can be used.
// On a hosted page (e.g. GitHub Pages) Syphon is unavailable; ?hosted=1 forces that mode for previews.
const IS_LOCAL = URLQ.get('hosted') === '1' ? false
  : (/^(localhost|127\.0\.0\.1|\[::1\]|::1)$/.test(location.hostname) || location.protocol === 'file:');
// UI texts: the strings in this file are English; DE maps them to German (used when the language is "de").
const DE = {
  'Inside': 'Innen', 'Outside': 'Außen', 'Domemaster': 'Domemaster',
  'Layers': 'Ebenen', 'Layer settings': 'Layer-Einstellungen', '+ Add layer': '+ Layer hinzufügen', 'Name': 'Name',
  'Source': 'Quelle', 'Type': 'Typ', 'Test pattern': 'Testbild', 'Syphon (via bridge)': 'Syphon (über Brücke)',
  'Camera / virtual cam': 'Kamera / Virtual Cam', 'Window / screen': 'Fenster / Bildschirm', 'Video / image file': 'Video- oder Bilddatei',

  'Transfer': 'Übertragung', '960 px wide': '960 px breit', '1280 px wide': '1280 px breit', '1920 px wide': '1920 px breit', '2560 px wide': '2560 px breit',
  'Original': 'Original', 'Refresh server list': 'Server-Liste aktualisieren',
  'Device': 'Gerät', 'Default camera': 'Standardkamera', '— load devices first —': '— zuerst „Geräte laden“ —',
  'Load devices': 'Geräte laden', 'Reconnect': 'Neu verbinden', 'Choose window / screen …': 'Fenster / Bildschirm wählen …', 'File': 'Datei',
  'Source crop': 'Zuschnitt der Quelle', 'Crop left': 'Links abschn.', 'Crop right': 'Rechts abschn.', 'Crop top': 'Oben abschn.', 'Crop bottom': 'Unten abschn.',
  'Whole image': 'Ganzes Bild', 'Left half': 'Linke Hälfte', 'Right half': 'Rechte Hälfte', 'Top half': 'Obere Hälfte', 'Bottom half': 'Untere Hälfte',
  'Flip horizontally': 'Horizontal spiegeln', 'Flip vertically': 'Vertikal spiegeln',

  'Flat – screen in front of audience (quad)': 'Flach – Screen vor dem Publikum (Viereck)',
  'Quad in domemaster plane': 'Viereck in der Domemaster-Ebene', 'Quad in azimuth/elevation': 'Viereck in Azimut/Elevation',
  'Panorama band 360° (equirect)': 'Panorama-Band 360° (Equirect)', 'Full domemaster (1:1 fisheye)': 'Domemaster-Vollbild (1:1 Fisheye)',
  'Azimuth / rot.': 'Azimut / Dreh.', 'Elevation': 'Elevation', 'Size (width)': 'Größe (Breite)', 'Roll': 'Roll',
  'Aspect follows source': 'Seitenverhältnis folgt Quelle', 'Aspect': 'Seitenverh.',
  'Keystone vertical': 'Trapez vertikal', 'Keystone horizontal': 'Trapez horizontal',
  'Keystone vertical: + = narrower at top, − = wider at top. Keystone horizontal: + = right edge lower, − = left edge lower. Fine-tune with the corner handles in the viewport.':
    'Trapez vertikal: + = oben schmaler, − = oben breiter. Trapez horizontal: + = rechte Kante niedriger, − = linke Kante niedriger. Feinschliff über die Eckpunkte im Viewport.',
  'Reset distortion': 'Verzerrung zurücksetzen',
  'Drag corners = perspective warp · drag surface = move · Alt+scroll = scale':
    'Ecken ziehen = perspektivisch verzerren · Fläche ziehen = verschieben · Alt+Scrollen = skalieren',
  'Appearance': 'Darstellung', 'Opacity': 'Deckkraft', 'Blend': 'Blend', 'Edge feather': 'Randweiche', 'Feather per side': 'Randweiche pro Seite',
  'Left': 'Links', 'Right': 'Rechts', 'Top': 'Oben', 'Bottom': 'Unten', 'Falloff': 'Verlauf',
  'compact': 'kompakt', 'normal': 'normal', 'wide': 'weit',
  'Edge feather = width of the transition (100 % reaches the image center). Falloff = curve shape: compact keeps the image bright up to near the edge and fades quickly there, wide darkens gently over the whole edge zone.':
    'Randweiche = Breite des Übergangs (100 % reicht bis zur Bildmitte). Verlauf = Form der Kurve: kompakt hält das Bild bis nahe an den Rand hell und blendet dort schnell aus, weit dunkelt es über die ganze Randzone sanft ab.',
  'Extend edges (fill background)': 'Rand erweitern (Hintergrund füllen)', 'Mode': 'Modus', 'Off': 'Aus',

/* ───────────── Geometry ─────────────
   A layer is a quad on the dome. Its corners lie in a tangent plane around the layer centre (az/el/roll).
   The "mapping" decides in which plane the content is interpolated between the corners:
   0 = tangent plane (gnomonic, behaves like a flat screen), 1 = domemaster plane, 2 = azimuth/elevation,
   3 = panorama band, 4 = full domemaster. */
function frameOf(az, el, roll) {
  const c = [Math.cos(el) * Math.sin(az), Math.sin(el), -Math.cos(el) * Math.cos(az)];
  const r0 = [Math.cos(az), 0, Math.sin(az)];
  const u0 = V.cross(r0, c);
  const cr = Math.cos(roll), sr = Math.sin(roll);
  return {
    c,
    r: [r0[0]*cr + u0[0]*sr, r0[1]*cr + u0[1]*sr, r0[2]*cr + u0[2]*sr],
    u: [-r0[0]*sr + u0[0]*cr, -r0[1]*sr + u0[1]*cr, -r0[2]*sr + u0[2]*cr],
  };
}
function dirToPlane(mode, d, G) {
  if (mode === 0) { const s = Math.max(V.dot(d, G.c), 0.02); return [V.dot(d, G.r) / s, V.dot(d, G.u) / s]; }
  if (mode === 1) {
    const y = clamp(d[1], -1, 1), sn = Math.max(Math.sqrt(1 - y*y), 1e-5), k = Math.acos(y) / (Math.PI / 2) / sn;
    return [d[0] * k, d[2] * k];                  // domemaster: front = bottom, right = +x
  }

}
function planeToDir(mode, p, G) {

    const rho = Math.hypot(p[0], p[1]), th = rho * Math.PI / 2, az = Math.atan2(p[0], p[1]);
    return [Math.sin(th) * Math.sin(az), Math.cos(th), Math.sin(th) * Math.cos(az)];

    L.oy[drag.k] = V.dot(dv, G.u) / s / G.hh - G.sy[drag.k] - G.ky[drag.k];
  } else if (L.mapping === 4) {   // full domemaster: rotate around the zenith
    const a = Math.atan2(dv[0], -dv[2]) - Math.atan2(drag.g0[0], -drag.g0[2]);
    L.az = wrapPi((drag.az * D2R) + a) * R2D;
  } else {
    const axis = V.cross(drag.g0, dv), sn = V.len(axis);
    if (sn < 1e-9) return;
    const k = V.mul(axis, 1 / sn), ang = Math.atan2(sn, V.dot(drag.g0, dv)), ca = Math.cos(ang), sa = Math.sin(ang);
    const rot = v => V.add(V.add(V.mul(v, ca), V.mul(V.cross(k, v), sa)), V.mul(k, V.dot(k, v) * (1 - ca)));
    const cc = rot(drag.c0), rr = rot(drag.r0);
    const el = Math.asin(clamp(cc[1], -1, 1));
    let az = drag.az * D2R;
    if (Math.cos(el) > 1e-4) az = Math.atan2(cc[0], -cc[2]);
    const r0 = [Math.cos(az), 0, Math.sin(az)], u0 = V.cross(r0, cc);
    L.az = az * R2D; L.el = clamp(el * R2D, -15, 90); L.roll = Math.atan2(V.dot(rr, u0), V.dot(rr, r0)) * R2D;
  }

});
const endDrag = () => { drag = null; ov.classList.remove('grabbing'); };
ov.addEventListener('pointerup', endDrag); ov.addEventListener('pointercancel', endDrag);
function zoomFov(k) {
  if (state.view === 'outside') state.cam.outDist = clamp(state.cam.outDist * k, 1.6, 12);
  else if (state.view === 'inside') {
    if (state.dome.lens) state.cam.fovFish = clamp(state.cam.fovFish * k, 30, 240);
    else state.cam.fovRect = clamp(state.cam.fovRect * k, 30, 140);
  }
}
// Trackpad: two fingers = eye height (vertical) / seat angle (horizontal), pinch = zoom, Alt = scale layer, Cmd = seat distance
ov.addEventListener('wheel', e => {
  e.preventDefault();
  const d = state.dome, Rm = d.diameter / 2;
  if (e.ctrlKey) { zoomFov(Math.exp(e.deltaY * 0.012)); }            // pinch (Chrome reports it as ctrl+wheel)
  else if (e.altKey) {
    const L = state.layers[state.sel];
    if (L && L.used && !L.locked) L.size = clamp(L.size * Math.exp(-(e.deltaY || e.deltaX) * 0.0025), 3, 360);
  } else if (state.view === 'inside') {
    if (e.metaKey) d.seatDist = clamp(d.seatDist - e.deltaY * 0.02, 0, Rm * 0.9);
    else {
      d.eyeH = clamp(d.eyeH - e.deltaY * 0.0025, 0.4, 2.2);
      d.seatAng = (d.seatAng + e.deltaX * 0.2 + 360) % 360;
    }
  } else if (state.view === 'outside') {
    state.cam.outDist = clamp(state.cam.outDist * Math.exp(e.deltaY * 0.002), 1.6, 12);
    state.cam.outYaw -= e.deltaX * 0.25;
  }
  syncUI(); save();
}, { passive: false });

function applyPanels() {
  const app = document.getElementById('app');
  app.classList.toggle('noL', !uiPrefs.left); app.classList.toggle('noR', !uiPrefs.right);
  document.getElementById('toggleL').textContent = uiPrefs.left ? '‹' : '›';
  document.getElementById('toggleR').textContent = uiPrefs.right ? '›' : '‹';
  savePrefs();
}
document.getElementById('toggleL').addEventListener('click', () => { uiPrefs.left = !uiPrefs.left; applyPanels(); });
document.getElementById('toggleR').addEventListener('click', () => { uiPrefs.right = !uiPrefs.right; applyPanels(); });
const viewBtns = [...document.querySelectorAll('#views button[data-v]')];
const uiBtn = document.getElementById('uiToggle');
function setShowUI(v) { state.showUI = !!v; uiBtn.classList.toggle('on', state.showUI); if (!state.showUI) drag = null; updateHint(); save(); }
uiBtn.addEventListener('click', () => setShowUI(!state.showUI));
const gridBtn = document.getElementById('gridToggle'), gridAmt = document.getElementById('gridAmt');
function syncGridUI() {
  gridBtn.classList.toggle('on', !!state.dome.gridOn);
  gridAmt.disabled = !state.dome.gridOn;
  if (document.activeElement !== gridAmt) gridAmt.value = state.dome.grid;
}
gridBtn.addEventListener('click', () => { state.dome.gridOn = !state.dome.gridOn; syncGridUI(); save(); });
gridAmt.addEventListener('input', () => { state.dome.grid = parseFloat(gridAmt.value); if (!state.dome.gridOn) state.dome.gridOn = true; syncGridUI(); save(); });
syncs.push(syncGridUI);
const showBtn = document.getElementById('showToggle');
function setShowMode(v) { state.show.on = !!v; showBtn.classList.toggle('on', state.show.on); resize(); syncUI(); save(); }
showBtn.addEventListener('click', () => setShowMode(!state.show.on));
function setView(v) { state.view = v; viewBtns.forEach(b => b.classList.toggle('on', b.dataset.v === v)); updateHint(); save(); }
viewBtns.forEach(b => b.addEventListener('click', () => setView(b.dataset.v)));
function updateHint() {
  if (!state.showUI) { document.getElementById('hint').textContent = T('Controls hidden · drag: look around · R: show frames again · H: columns · F: fullscreen'); return; }
  document.getElementById('hint').textContent = T(state.view === 'master'
    ? 'Domemaster (bottom = front) · drag corners: perspective · drag surface: move · Alt+scroll: scale · Tab: layer · H: columns · F: fullscreen'
    : state.view === 'inside'
    ? 'Drag: look around · two fingers ↑↓: eye height, ←→: walk around the dome · Cmd+↑↓: seat distance · pinch/+/−: zoom · Alt+scroll: scale layer · drag corners: perspective'
    : 'Drag: orbit · drag the yellow seat: audience position · two fingers ↑↓: distance · drag corners: perspective · Alt+scroll: scale layer');
}
addEventListener('keydown', e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName) && document.activeElement.type !== 'range') return;
  if (e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (k === '1') setView('inside'); else if (k === '2') setView('outside'); else if (k === '3') setView('master');
  else if (k === 'h') { const both = uiPrefs.left || uiPrefs.right; uiPrefs.left = uiPrefs.right = !both; applyPanels(); }
  else if (k === '[') { uiPrefs.left = !uiPrefs.left; applyPanels(); }
  else if (k === ']') { uiPrefs.right = !uiPrefs.right; applyPanels(); }
  else if (k === 'r') setShowUI(!state.showUI);
  else if (k === 's') setShowMode(!state.show.on);
  else if (k === 'g') { state.dome.gridOn = !state.dome.gridOn; syncGridUI(); save(); }
  else if (k === 'd') openDomeWindow();
  else if (k === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
  else if (k === 'tab') { e.preventDefault(); const o = state.order; if (o.length) selectLayer(o[(o.indexOf(state.sel) + 1) % o.length]); }
  else if (k === '+' || k === '=') { zoomFov(0.93); syncUI(); save(); }
  else if (k === '-') { zoomFov(1.075); syncUI(); save(); }
});

/* ───────────── Start-up ───────────── */
function resize() {
  const st = document.getElementById('stage');
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = st.clientWidth; H = st.clientHeight;
  const sc = state.show.on ? state.show.scale : 1;   // render smaller in show mode, stretched via CSS
  ov.width = Math.max(1, Math.round(W * DPR));
  ov.height = Math.max(1, Math.round(H * DPR));
  glc.width = Math.max(1, Math.round(W * DPR * sc));
  glc.height = Math.max(1, Math.round(H * DPR * sc));
}
if (!gl) { document.getElementById('nogl').hidden = false; }
else {
  try {
    translateStatic();
    mainCtx = makeGLContext(glc);
    if (!mainCtx) throw new Error('WebGL2 not available');
    useCtx(mainCtx);
    buildPanel();
    if (DEMO) document.body.classList.add('demo');
    if (DEMO === 'popup') { uiPrefs.left = uiPrefs.right = false; document.body.classList.add('demo-popup'); }
    applyPanels();
    new ResizeObserver(resize).observe(document.getElementById('stage')); resize();
    selectLayer(state.sel); setView(state.view); setShowUI(state.showUI); showBtn.classList.toggle('on', state.show.on); resize(); syncUI();
    refreshDevices();
    if (navigator.mediaDevices) navigator.mediaDevices.addEventListener('devicechange', refreshDevices);
    state.layers.forEach((L, i) => {
      if (!L.used) return;
      if (L.srcType === 'camera') connectCamera(i);
      else if (L.srcType === 'syphon') { slots[i].type = 'syphon'; slots[i].status = T(IS_LOCAL ? 'Bridge not connected' : 'Syphon is only available offline – run the sim locally (start.command, macOS).'); }
    });
    renderServers(); bridgeStatus(); if (IS_LOCAL) bridgeConnect();   // hosted pages never touch localhost
    scheduleFrame();
    // Watchdog: if the rAF chain breaks (e.g. window was occluded at start), kick it off again right away
    setInterval(() => { if (performance.now() - lastTick > 700) { rafPending = false; scheduleFrame(); } }, 400);
  } catch (e) {
    document.getElementById('nogl').hidden = false;
    document.getElementById('nogl').textContent = Tf('Error: {0}', e.message);
    console.error(e);
  }
}
// for debugging in the console
window.__dome = { drawDomeWindow, perf, tick, scheduleFrame, bridge, slots, state, domeWin, attachDomeWindow, openDomeWindow, setShowMode, geom, cam, screenToDir, dirToScreen, layerUV, squareToQuad, invertH, dirToPlane, planeToDir };
})();
